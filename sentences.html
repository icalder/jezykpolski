<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polish Sentence Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin: 0;
            text-align: center;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #category-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e0;
            background-color: white;
            font-family: inherit;
            color: #2d3748;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        #category-select:focus {
            border-color: #4a5568;
        }


        #refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #2c3e50;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #refresh-btn:hover {
            background-color: #e2e8f0;
        }

        #refresh-btn svg {
            width: 24px;
            height: 24px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .sentence-card {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            user-select: none;
            touch-action: pan-y;
        }

        .sentence-card:active {
            transform: scale(0.98);
        }

        .polish {
            font-size: 1.2rem;
            font-weight: 500;
            display: block;
            margin-bottom: 10px;
            color: #1a202c;
        }

        .translation {
            font-size: 1rem;
            color: #718096;
            display: none;
            border-top: 1px solid #edf2f7;
            padding-top: 10px;
            font-style: italic;
        }

        .eng-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .verb-line {
            font-size: 1rem;
            font-weight: 400;
        }

        .perf-badge {
            display: inline-block;
            background-color: #e9d5ff;
            color: #6b21a8;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
            margin: 0 6px;
            vertical-align: middle;
            text-transform: uppercase;
            line-height: 1;
            border: 1px solid #d8b4fe;
        }

        .sentence-card.revealed .translation {
            display: block;
        }

        .hint {
            text-align: center;
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="controls">
            <h1 id="page-title">Polish Practice</h1>
            <select id="category-select">
                <option value="all">Loading…</option>
            </select>
            <button id="refresh-btn" title="Reset Cards">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
        </div>
    </div>
    <div class="hint">Tap a sentence to reveal the translation</div>
    <div class="container" id="sentence-container"></div>

    <script>
        let CATEGORY_MANIFEST = null;
        const sentenceCache = new Map();

        function parseJSONL(text) {
            const lines = text.trim().split('\n');
            const result = { title: null, sentences: [] };
            for (const line of lines) {
                if (!line.trim()) continue;
                try {
                    const obj = JSON.parse(line);
                    if (obj.title && result.title === null) result.title = obj.title;
                    else result.sentences.push(obj);
                } catch (e) {
                    console.warn('Failed to parse JSONL line:', line);
                }
            }
            return result;
        }

        async function loadJSONL(fileBaseName) {
            const cacheKey = `${fileBaseName}.jsonl`;
            if (sentenceCache.has(cacheKey)) return sentenceCache.get(cacheKey);
            const response = await fetch(`sentences/${cacheKey}`);
            if (!response.ok) throw new Error(`Could not load sentences/${cacheKey}`);
            const text = await response.text();
            const data = parseJSONL(text);
            sentenceCache.set(cacheKey, data);
            return data;
        }

        function populateCategorySelect() {
            const select = document.getElementById('category-select');
            select.innerHTML = '';
            const allOpt = document.createElement('option');
            allOpt.value = 'all';
            allOpt.textContent = CATEGORY_MANIFEST.allLabel || 'All Categories';
            select.appendChild(allOpt);
            CATEGORY_MANIFEST.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                select.appendChild(opt);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function loadSentences() {
            const container = document.getElementById('sentence-container');
            const titleEl = document.getElementById('page-title');
            const categorySelect = document.getElementById('category-select');
            
            const urlParams = new URLSearchParams(window.location.search);
            const dataFile = urlParams.get('file');

            try {
                let allSentences = [];
                let finalTitle = "Polish Practice";

                if (dataFile) {
                    // Handle legacy/specific file query parameter (supports .json and .jsonl)
                    const response = await fetch(dataFile);
                    if (!response.ok) throw new Error(`Could not load ${dataFile}`);
                    const text = await response.text();
                    const data = dataFile.endsWith('.jsonl') ? parseJSONL(text) : JSON.parse(text);
                    allSentences = data.sentences;
                    finalTitle = data.title || finalTitle;
                } else {
                    // Use the category selector (driven by manifest)
                    const selectedCat = categorySelect.value;

                    if (selectedCat === 'all') {
                        const results = await Promise.all(
                            CATEGORY_MANIFEST.categories.map(cat => loadJSONL(cat.file))
                        );
                        results.forEach(data => {
                            if (data.sentences) {
                                allSentences = allSentences.concat(data.sentences);
                            }
                        });
                        finalTitle = CATEGORY_MANIFEST.allLabel || 'All Polish Practice';
                    } else {
                        const cat = CATEGORY_MANIFEST.categories.find(c => c.id === selectedCat);
                        if (cat) {
                            const data = await loadJSONL(cat.file);
                            allSentences = data.sentences;
                            finalTitle = data.title || cat.name;
                        }
                    }
                }

                titleEl.textContent = finalTitle;
                shuffle(allSentences);
                container.innerHTML = '';

                if (allSentences.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #718096;">No sentences found for this category.</p>';
                    return;
                }

                container.innerHTML = allSentences.map(s => {
                    const verbsHtml = s.verbs.map((v, i) => {
                        const verbContent = typeof v === 'object' 
                            ? `${v.infinitive} (${v.translation})${v.perfective ? '<span class="perf-badge">P</span>' : ''}`
                            : v;
                        const line = `<span class="verb-line">${verbContent}</span>`;
                        return i === 0 ? line : `<br>${line}`;
                    }).join('');
                    return `
                        <div class="sentence-card">
                            <span class="polish">${s.polish}</span>
                            <div class="translation">
                                <span class="eng-text">${s.english}</span>
                                ${verbsHtml ? `<hr style="border: 0; border-top: 1px solid #edf2f7; margin: 5px 0;" />` : ''}
                                ${verbsHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                // Attach listeners to each card
                document.querySelectorAll('.sentence-card').forEach(card => {
                    let startX = 0;
                    let currentX = 0;
                    let isSwiping = false;

                    const handleStart = (x) => {
                        startX = x;
                        isSwiping = false;
                    };

                    const handleMove = (x) => {
                        currentX = x;
                        const diffX = currentX - startX;
                        if (diffX > 10) {
                            isSwiping = true;
                            card.style.transition = 'none';
                            card.style.transform = `translateX(${diffX}px)`;
                        }
                    };

                    const handleEnd = () => {
                        const diffX = currentX - startX;
                        card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        
                        if (diffX > 100) {
                            card.style.transform = `translateX(100%)`;
                            card.style.opacity = '0';
                            setTimeout(() => card.remove(), 300);
                        } else {
                            card.style.transform = `translateX(0)`;
                            card.style.opacity = '1';
                        }
                    };

                    // Touch events
                    card.addEventListener('touchstart', (e) => {
                        handleStart(e.touches[0].clientX);
                    }, {passive: true});

                    card.addEventListener('touchmove', (e) => {
                        handleMove(e.touches[0].clientX);
                    }, {passive: true});

                    card.addEventListener('touchend', handleEnd);

                    // Mouse events
                    card.addEventListener('mousedown', (e) => {
                        handleStart(e.clientX);
                        
                        const onMouseMove = (moveEvent) => {
                            handleMove(moveEvent.clientX);
                        };

                        const onMouseUp = () => {
                            handleEnd();
                            window.removeEventListener('mousemove', onMouseMove);
                            window.removeEventListener('mouseup', onMouseUp);
                        };

                        window.addEventListener('mousemove', onMouseMove);
                        window.addEventListener('mouseup', onMouseUp);
                    });

                    card.addEventListener('click', (e) => {
                        if (isSwiping) {
                            e.stopPropagation();
                            return;
                        }
                        card.classList.toggle('revealed');
                    });
                });

            } catch (error) {
                container.innerHTML = `<p style="color: red; text-align: center;">Error loading data: ${error.message}</p>`;
                console.error(error);
            }
        }

        async function init() {
            const response = await fetch('sentences/categories.json');
            if (!response.ok) throw new Error('Could not load categories manifest');
            CATEGORY_MANIFEST = await response.json();
            populateCategorySelect();
            await loadSentences();
        }

        document.getElementById('category-select').addEventListener('change', () => {
            sentenceCache.clear();
            loadSentences();
        });
        document.getElementById('refresh-btn').addEventListener('click', () => {
            sentenceCache.clear();
            loadSentences();
        });

        init().catch(e => {
            document.getElementById('sentence-container').innerHTML =
                `<p style="color: red; text-align: center;">Error loading categories: ${e.message}</p>`;
            console.error(e);
        });
    </script>
</body
></html>
